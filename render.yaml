services:
  # Spring Boot Backend API
  - type: web
    name: habit-tracker-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: habit-tracker-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: habit-tracker-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: habit-tracker-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: habit-tracker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: habit-tracker-db
          property: password
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: habit-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

databases:
  # Managed PostgreSQL
  - name: habit-tracker-db
    plan: free
    region: oregon
    databaseName: habittracker
    user: habituser
